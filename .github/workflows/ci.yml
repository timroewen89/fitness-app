name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installeer dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Installeer Playwright-browser
        run: npx playwright install --with-deps chromium
      - name: Draai smoketests
        run: npm test
